name: Asset Class Trend-Following (Strategy 18)

"on":
  schedule:
    # 14:35 UTC (30 min after market open), first 3 calendar days of the month, Mon-Fri.
    # The "first trading day" guard step below narrows this down to exactly one run/month.
    - cron: '35 14 1-3 * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebalance:
    runs-on: ubuntu-latest
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - uses: actions/checkout@v4

      - name: Skip if US market holiday
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          HOLIDAYS="2026-01-01 2026-01-19 2026-02-16 2026-04-03 2026-05-25 2026-06-19 2026-07-03 2026-09-07 2026-11-26 2026-12-25"
          if echo "$HOLIDAYS" | grep -qw "$TODAY"; then
            echo "US market holiday ($TODAY) — skipping"
            exit 0
          fi

      - name: First-trading-day-of-month guard
        if: github.event_name == 'schedule'
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          MONTH_START=$(date -u +%Y-%m-01)
          MONTH_END=$(date -u -d "$MONTH_START +6 days" +%Y-%m-%d 2>/dev/null || date -u -v+6d -jf "%Y-%m-%d" "$MONTH_START" +%Y-%m-%d)
          FIRST_TRADING_DAY=$(curl -s -H "APCA-API-KEY-ID: $ALPACA_API_KEY" -H "APCA-API-SECRET-KEY: $ALPACA_SECRET_KEY" \
            "https://paper-api.alpaca.markets/v2/calendar?start=${MONTH_START}&end=${MONTH_END}" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d[0]['date'] if d else '')")
          echo "Today: $TODAY | First trading day of month: $FIRST_TRADING_DAY"
          if [ -z "$FIRST_TRADING_DAY" ]; then
            echo "Could not determine first trading day from Alpaca calendar — proceeding anyway (fail open)"
          elif [ "$TODAY" != "$FIRST_TRADING_DAY" ]; then
            echo "Not the first trading day of the month — skipping"
            exit 0
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --quiet yfinance pandas

      - name: Run Asset Class Trend-Following rebalance
        run: python3 scripts/asset_class_tf.py --allocation 0.6

      - name: Commit and push
        run: |
          git config user.name "trading-bot"
          git config user.email "bot@trading-bot"
          git add memory/asset_class_tf_state.json memory/ASSET-CLASS-TF-LOG.md
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Asset class TF rebalance $(date -u +%Y-%m-%d)"
          git push
